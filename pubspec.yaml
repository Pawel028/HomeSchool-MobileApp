name: homeschooling
description: HomeSchooling - an Android-first app for homeschooling families in India. Parents plan, children play, parents see progress.
publish_to: none
# Keep in sync with lib/core/app_version.dart (test/app_version_test.dart enforces it).
version: 0.1.0+4

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
